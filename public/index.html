<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daniel Choi</title>
<link rel="canonical" href="https://www.daniel-choi.com/about/">
<meta name="robots" content="noindex">
<!-- location.replace fires before paint, so nothing is shown, and it leaves no
     history entry (Back skips straight past it). meta refresh is the fallback
     for a browser with JS disabled; noscript keeps the visible link off-screen
     until it is actually needed. -->
<script>location.replace('/about/' + location.search + location.hash)</script>
<meta http-equiv="refresh" content="0;url=/about/">
</head>
<body>
<noscript><a href="/about/">Continue to daniel-choi.com/about/</a></noscript>
</body>
</html>
