<!DOCTYPE html>
<!--
  Starter for a page under public/apps/<slug>/.

  Copy this to public/apps/<slug>/index.html, replace the title, breadcrumb
  label and the contents of <main>, then add a row to src/data/apps.ts.

  What to keep as-is:
    - the :root tokens, which mirror src/styles/global.css. If the site palette
      changes these need the same edit; public/ files are served verbatim and
      can't import the built stylesheet, whose filename is content-hashed
    - the breadcrumb, in the page flow rather than fixed to a corner (a
      floating pill overlaps content on a phone)
    - the 620px column and the two breakpoints
    - no webfonts: the site uses a system stack

  What to change freely:
    - everything inside <main>, including any extra CSS and all the JavaScript

  See docs/writing-posts.md for the thumbnail capture recipe.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App name</title>
<meta name="description" content="One sentence describing what this does.">
<style>
  :root{
    /* mirrors src/styles/global.css — keep in step if the site palette changes */
    --bg:#f2f4f6; --panel:#fff; --ink:#111; --muted:#767676; --soft:#666;
    --rule:#ddd; --field:#e6eaee;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;padding:22px 28px 32px}
  .wrap{max-width:620px;margin:0 auto}

  /* breadcrumb — matches the site nav, muted until hover */
  .crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px;
    font-size:15px}
  .crumbs a{color:var(--muted);text-decoration:none}
  .crumbs a:hover{color:var(--ink)}
  .crumbs span{color:var(--rule)}

  h1{font-size:22px;font-weight:500;line-height:1.35;margin:0 0 6px;letter-spacing:-.01em}
  .sub{margin:0 0 16px;max-width:56ch;font-size:15px;color:var(--soft);text-wrap:pretty}
  .sub em{font-style:normal;color:var(--ink)}

  /* controls */
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
  select,input[type=text],button.chip{background:var(--panel);border:1px solid var(--rule);
    border-radius:3px;padding:7px 10px;font-size:15px;font-family:inherit;color:var(--ink)}
  select:hover,button.chip:hover{border-color:var(--muted)}
  select:disabled,button.chip:disabled{opacity:.45;cursor:default;border-color:var(--rule)}
  button{cursor:pointer}
  button.primary{background:var(--ink);color:#fff;border:none;border-radius:3px;
    padding:10px 20px;font-size:15px;font-weight:500;font-family:inherit}
  button.primary:hover{background:#333}
  label.check{display:flex;gap:7px;align-items:center;font-size:15px;color:var(--soft)}
  .actions{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:0 0 8px}
  #status{font-size:14px;color:var(--muted);min-height:1.4em;margin-bottom:12px}
  button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--ink);
    outline-offset:2px}

  /* main area beside a sidebar; both go full width on a phone */
  .split{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
  .panel{background:var(--panel);padding:10px;border-radius:4px;border:1px solid var(--rule);
    flex:0 1 338px;min-width:0;max-width:100%}
  .side{flex:1 1 160px;min-width:160px;display:flex;flex-direction:column;gap:14px}
  .note{font-size:12.5px;line-height:1.5;color:var(--muted);margin:0;text-wrap:pretty}

  @media (max-width:640px){
    body{padding:16px 16px 28px}
    .crumbs{margin-bottom:10px;font-size:14px}
    h1{font-size:19px;margin-bottom:4px}
    .sub{font-size:13.5px;margin-bottom:12px}
    .controls{gap:6px;margin-bottom:8px}
    select,button.chip{padding:6px 8px;font-size:14px}
    button.primary{padding:9px 16px}
    .actions{gap:8px 14px}
    label.check{font-size:14px}
    #status{font-size:13px;margin-bottom:8px}
    .split{gap:14px}
    .panel{flex:1 1 100%}
    .side{flex:1 1 100%;min-width:0}
    .note{font-size:12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <nav class="crumbs">
    <a href="/">Daniel Choi</a>
    <span aria-hidden="true">/</span>
    <a href="/apps/">Apps</a>
  </nav>

  <h1>App name</h1>
  <p class="sub">One or two lines on what this does and how to drive it.</p>

  <div class="controls">
    <!-- selects, chips -->
  </div>
  <div class="actions">
    <button class="primary" id="goBtn">Go</button>
    <!-- <label class="check"><input type="checkbox"> Option</label> -->
  </div>
  <div id="status" aria-live="polite"></div>

  <div class="split">
    <main class="panel">
      <!-- the thing itself -->
    </main>
    <div class="side">
      <!-- legend, key, notes -->
      <p class="note">Supporting detail goes here rather than under the main
        panel, so the page stays short enough to fit one screen.</p>
    </div>
  </div>
</div>

<script>
  // app code here
</script>
</body>
</html>
